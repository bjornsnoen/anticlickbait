on:
  push:
    branches:
      - main

name: Build and publish extension to browser stores

jobs:
  build_and_publish:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - firefox
          - chrome
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install ImageMagick and potrace
        run: sudo apt-get update && sudo apt-get install -y imagemagick potrace

      - name: Install dependencies
        run: pnpm install

      - name: Check if new package version
        id: check_version
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'

          const previous = JSON.parse(execFileSync('git', ['show', 'HEAD^:package.json'], { encoding: 'utf8' }))
          const current = JSON.parse(readFileSync('package.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `has-updated=${current.version !== previous.version}\n`)
          NODE

      - name: Build the extension for ${{ matrix.target }}
        if: steps.check_version.outputs.has-updated == 'true'
        run: pnpm build:${{ matrix.target }}

      - name: Publish to AMO
        if: |
          steps.check_version.outputs.has-updated == 'true' &&
          matrix.target == 'firefox'
        run: pnpm sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Package zip for chrome
        if: |
          steps.check_version.outputs.has-updated == 'true' &&
          matrix.target == 'chrome'
        run: pnpm package

      - name: Publish to Chrome Web store
        if: |
          steps.check_version.outputs.has-updated == 'true' &&
          matrix.target == 'chrome'
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          extension-id: ${{ secrets.GWS_EXTENSION_ID }}
          client-id: ${{ secrets.GWS_CLIENT_ID }}
          client-secret: ${{ secrets.GWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.GWS_REFRESH_TOKEN }}
          glob: true
          file-path: dist/anti-clickbait-*.zip
